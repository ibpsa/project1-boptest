services:
  # A service to provision needed resources during development
  # The main task is to upload test cases
  # This is not a production container,
  # but the "boptest_submit" python module that is executed
  # by this service may be useful in provisioning a production environment
  provision:
    build: service/provision
    depends_on:
      - web
    environment:
      - BOPTEST_SERVER=${BOPTEST_SERVER}
      - BOPTEST_DASHBOARD_SERVER=${BOPTEST_DASHBOARD_SERVER}
      - BOPTEST_DASHBOARD_API_KEY=${BOPTEST_TEST_PRIVILEGED_KEY}
      - BOPTEST_INTERNAL_S3_URL=${BOPTEST_INTERNAL_S3_URL}
      - BOPTEST_REGION=${BOPTEST_REGION}

    volumes:
      - ./:/usr/src/boptest
  web: # main boptest application
    build:
      dockerfile: service/web/Dockerfile
      context: .
      args:
        - NODE_ENV
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - BOPTEST_SERVER=${BOPTEST_SERVER}
      - BOPTEST_JOB_QUEUE_URL=${BOPTEST_JOB_QUEUE_URL}
      - BOPTEST_INTERNAL_S3_URL=${BOPTEST_INTERNAL_S3_URL}
      - BOPTEST_PUBLIC_S3_URL=${BOPTEST_PUBLIC_S3_URL}
      - BOPTEST_S3_BUCKET=${BOPTEST_S3_BUCKET}
      - BOPTEST_REDIS_HOST=${BOPTEST_REDIS_HOST}
      - BOPTEST_REGION=${BOPTEST_REGION}
      - BOPTEST_TIMEOUT=${BOPTEST_TIMEOUT}
      - BOPTEST_MESSAGE_TIMEOUT=${BOPTEST_MESSAGE_TIMEOUT}
      - BOPTEST_DASHBOARD_SERVER=${BOPTEST_DASHBOARD_SERVER}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - BOPTEST_USE_TEST_USERS=${BOPTEST_USE_TEST_USERS} # If "true" the following user accounts will be used for testing
      - BOPTEST_TEST_USERNAME=${BOPTEST_TEST_USERNAME} # Only for testing
      - BOPTEST_TEST_KEY=${BOPTEST_TEST_KEY} # Only for testing
      - BOPTEST_TEST_PRIVILEGED_USERNAME=${BOPTEST_TEST_PRIVILEGED_USERNAME} # Only for testing
      - BOPTEST_TEST_PRIVILEGED_KEY=${BOPTEST_TEST_PRIVILEGED_KEY} # Only for testing
    depends_on:
      - redis
      - worker
      - seaweedfs
  # Local implementation of s3
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["mini"]
    ports:
      - "9000:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${BOPTEST_S3_BUCKET}
  worker:
    build:
      dockerfile: service/worker/Dockerfile
      context: .
    environment:
      - BOPTEST_JOB_QUEUE_URL=${BOPTEST_JOB_QUEUE_URL}
      - BOPTEST_LOGLEVEL=${BOPTEST_LOGLEVEL}
      - BOPTEST_INTERNAL_S3_URL=${BOPTEST_INTERNAL_S3_URL}
      - BOPTEST_S3_BUCKET=${BOPTEST_S3_BUCKET}
      - BOPTEST_REDIS_HOST=${BOPTEST_REDIS_HOST}
      - BOPTEST_REGION=${BOPTEST_REGION}
      - BOPTEST_DASHBOARD_SERVER=${BOPTEST_DASHBOARD_SERVER}
      - BOPTEST_DASHBOARD_API_KEY=${BOPTEST_DASHBOARD_API_KEY}
      - BOPTEST_TIMEOUT=${BOPTEST_TIMEOUT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      - redis
      - seaweedfs
  redis:
    image: redis
  test:
    build:
      dockerfile: service/test/Dockerfile
      context: .
    depends_on:
      - web
    environment:
      - BOPTEST_SERVER=${BOPTEST_SERVER}
      - BOPTEST_WS_SERVER=${BOPTEST_WS_SERVER}
      - BOPTEST_DASHBOARD_API_KEY=${BOPTEST_DASHBOARD_API_KEY}
      - BOPTEST_DASHBOARD_USERNAME=${BOPTEST_DASHBOARD_USERNAME}
      - BOPTEST_TEST_USERNAME=${BOPTEST_TEST_USERNAME}
      - BOPTEST_TEST_KEY=${BOPTEST_TEST_KEY}
      - BOPTEST_TEST_PRIVILEGED_USERNAME=${BOPTEST_TEST_PRIVILEGED_USERNAME}
      - BOPTEST_TEST_PRIVILEGED_KEY=${BOPTEST_TEST_PRIVILEGED_KEY}
      - BOPTEST_USE_TEST_USERS=${BOPTEST_USE_TEST_USERS}
